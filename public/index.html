<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reverb</title>
<script src="/state.js"></script>
<style>
:root{--navy:#050f2a;--purple:#6a0b97;--blue:#0b47b3;--red:#d00000;--green:#076b55;--acc:#6a0b97;--bg:#f4f5fa;--card:#fff;--line:#e2e5ee;--muted:#667085;--ok:#0a7d3c;--warn:#b54708;--bad:#c01048}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Poppins,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
a{color:var(--acc)}
/* logo */
.logo{display:flex;align-items:stretch;gap:.4em}
.logo .bar{width:.2em;min-height:100%;border-radius:1em;flex:none}
.logo .wm{font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.logo .wm b{font-weight:800}
.logo .tag{font-size:.2em;letter-spacing:.17em;font-weight:700;margin-top:.5em;white-space:nowrap;color:var(--navy)}
.logo .in{display:flex;flex-direction:column;justify-content:center;padding:.15em 0}
/* layout */
#app{display:flex;min-height:100vh}
.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex:none}
.side .brand{padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-weight:600}
.nav:hover{background:#f0f1f7}
.nav.on{background:var(--navy);color:#fff}
.nav .dot{width:8px;height:22px;border-radius:6px;flex:none}
.nav .chev{margin-left:auto;font-size:11px;opacity:.7}
.sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 17px;padding-left:10px;border-left:2px solid var(--line)}
.subnav{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:#475467;width:100%}
.subnav:hover{background:#f0f1f7}
.subnav.on{background:var(--pc);color:#fff}
.sep{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;padding:14px 10px 4px}
.grow{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:center;padding:14px 26px;background:#fff;border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:5}
.top h2{font-size:20px;white-space:nowrap}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f8f9fc}
#sres{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0002;max-height:60vh;overflow:auto;display:none}
#sres.show{display:block}
#sres .r{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
#sres .r:hover{background:#f3f4fa}
#sres .g{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:8px 12px 2px}
.page{padding:22px 26px 60px;max-width:1250px;width:100%}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{background:#f3f4fa}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef0f7;color:var(--navy);white-space:nowrap}
.pill.ok{background:#dcf5e6;color:var(--ok)}.pill.warn{background:#fff0dc;color:var(--warn)}.pill.bad{background:#fde3ec;color:var(--bad)}.pill.blue{background:#e1ebff;color:var(--blue)}.pill.red{background:#ffe3e3;color:var(--red)}.pill.green{background:#d8f3ea;color:var(--green)}.pill.purple{background:#f0e1f8;color:var(--purple)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #eef0f6;vertical-align:middle}
tr:hover td{background:#fafbfe}
.tw{overflow-x:auto}
.link{cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:#0003}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceef6;border-radius:14px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:12px;letter-spacing:.1em;display:flex;justify-content:space-between}
.pc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.stat{font-size:28px;font-weight:800}
.date{width:54px;flex:none;text-align:center;border-radius:10px;background:#f0f1f7;padding:6px 0}
.date b{display:block;font-size:20px;line-height:1}
.date span{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f6}
.item:last-child{border:0}
.star{color:#e8a200;letter-spacing:2px}
/* forms/modal */
.ov{position:fixed;inset:0;background:#050f2a88;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px #0006}
.modal.wide{max-width:860px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.w{grid-column:1/-1}
.fld span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.fld select[multiple]{min-height:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 8px 24px #0004}
.bar-bg{height:10px;background:#e8eaf3;border-radius:9px;overflow:hidden}
.bar-fg{height:100%;background:var(--acc)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.cta{border:2px dashed var(--line);background:transparent;text-align:center}

/* ---- Song database (AccrediHub-style layout, Reverb Radio colours) ---- */
.sp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sp-title{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sp-sub{color:var(--muted);font-size:14px;margin-top:2px}
.songs-page .btn,.modal .btn.sm{border-radius:99px}
.songs-page .btn.pri{background:linear-gradient(135deg,#0a9a78,#076b55);border-color:transparent;box-shadow:0 6px 18px rgba(7,107,85,.25)}
.fld .pill-theme{color:#fff;text-transform:none;letter-spacing:0;font-weight:600}
.songs-page .btn svg{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.sp-filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:240px;max-width:420px}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.in{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px}
.search-wrap .in{padding-left:36px}
.in:focus,.fld input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(7,107,85,.15)}
.chip-input-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:42px}
.chip-input-row input{flex:1;min-width:120px;border:0!important;background:transparent;padding:4px 2px!important;font-size:14px;box-shadow:none!important}
.chip-input-row input:focus{outline:none}
.pill-theme{background:linear-gradient(135deg,#0a9a78,#076b55);color:#fff;box-shadow:0 3px 10px rgba(7,107,85,.25)}
.pill-removable{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pill-removable:hover{background:#fde3ec;background-image:none;color:var(--bad);box-shadow:none}
.pill-removable svg{width:10px;height:10px}
.track-row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:8px;transition:border-color .12s,box-shadow .12s}
.track-row:hover{border-color:#c4cbe0;box-shadow:0 4px 14px rgba(5,15,42,.07)}
.art{width:52px;height:52px;border-radius:8px;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#ffffffd0}
.art svg{width:20px;height:20px}
.track-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.track-title{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.track-meta .link{color:var(--navy);font-weight:600}
.theme-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:260px;flex:none}
.track-col{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;flex:none;min-width:84px;text-align:right}
.track-col.len{min-width:42px}
.track-actions{display:flex;gap:6px;align-items:center;flex:none}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:#f3f4fa;color:var(--navy)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.active{background:#ffe9f1;color:#e0457b;border-color:transparent}
.icon-btn.nd{color:#16a34a}
.icon-btn.spacer{visibility:hidden;pointer-events:none}
.track-row.nd-only{background:transparent;border-style:dashed}
.track-row.nd-only .art,.track-row.nd-only .track-title,.track-row.nd-only .track-meta,.track-row.nd-only .track-col{opacity:.45;filter:grayscale(1)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{width:36px;height:36px;opacity:.5;margin-bottom:12px}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:1000px){.theme-pills{display:none}.track-col.rel{display:none}}

/* ---- Artists (AccrediHub-style) ---- */
.pg-art .btn,.hero-panel .btn{border-radius:99px}
.pg-art .btn.pri{background:linear-gradient(135deg,#8a2fc0,#6a0b97);border-color:transparent;box-shadow:0 6px 18px rgba(106,11,151,.25)}
.pg-art .btn svg{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
.artist-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;cursor:pointer;transition:transform .1s,box-shadow .14s}
.artist-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(5,15,42,.10)}
.artist-photo{width:100%;aspect-ratio:1/1;border-radius:50%;background-size:cover;background-position:center;margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#ffffffd9;font-weight:800;font-size:28px;letter-spacing:.02em}
.artist-card-name{font-weight:700;font-size:14.5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.artist-card-count{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.hero-panel{background:linear-gradient(145deg,rgba(106,11,151,.10),rgba(11,71,179,.05) 60%,transparent);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:32px}
.hero-panel .artist-photo{width:130px;margin:0;flex:none}
.ap-section{margin-bottom:40px}
.ap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.ap-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.ap-title svg{width:18px;height:18px}
.ap-count{color:var(--muted);font-size:12.5px;font-weight:500}
.ap-empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:13.5px}
.album-art{width:216px;height:216px;border-radius:22px;flex:none}
.album-art svg{width:72px;height:72px}
.art-single{width:104px;height:104px;border-radius:14px}
.art-single svg{width:32px;height:32px}
.track-no{width:34px;flex:none;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.track-row .tk-ico{width:44px;height:44px;border-radius:10px;background:#eef0f7;color:var(--muted)}
.album-block{display:flex;gap:18px;align-items:flex-start;margin-bottom:30px}
@media(max-width:700px){.album-block{flex-direction:column}.album-art{width:100%;height:auto;aspect-ratio:1/1;max-width:260px}}
.pg-press .btn,.pg-press .hero-panel .btn{border-radius:99px}
.pg-press .btn.pri{background:linear-gradient(135deg,#1a5fd6,#0b47b3);border-color:transparent;box-shadow:0 6px 18px rgba(11,71,179,.25)}
.pg-press .hero-panel{background:linear-gradient(145deg,rgba(11,71,179,.10),rgba(106,11,151,.04) 60%,transparent)}
/* auth screens */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:22px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:520px;box-shadow:0 10px 40px #0001}
.mod{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:10px;background:#fff;width:100%;text-align:left}
.mod.on{border-color:var(--navy);background:#f6f7fd}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.mod.on .chk{background:var(--navy);border-color:var(--navy);color:#fff}
.demo{background:#fff8e1;color:#7a5b00;font-size:12px;padding:6px 26px;border-bottom:1px solid #f2e2a8}
@media(max-width:860px){.sub{flex-direction:row;flex-wrap:wrap;width:100%;margin:0 0 6px;border:0;padding:0}.subnav{width:auto}#app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.side .brand{width:100%;padding-bottom:6px}.sep{display:none}.nav{width:auto}.grow{display:none}.two{grid-template-columns:1fr}.mb{grid-template-columns:1fr}.top{flex-wrap:wrap;padding:12px 16px}.page{padding:16px}}
@media print{body *{visibility:hidden}#runsheet,#runsheet *{visibility:visible}#runsheet{position:absolute;left:0;top:0;width:100%;padding:0}.noprint{display:none!important}.ov{position:static;background:none;padding:0}.modal{box-shadow:none;max-width:none}}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-dow{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-cell{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cal-cell.cal-out{opacity:.35}.cal-cell.cal-today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cal-daynum{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.cal-event{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef0f7;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;flex:none}
.cal-event:hover{filter:brightness(.95)}
.cal-event.ev-warn{background:#fff0dc;color:var(--warn)}.cal-event.ev-ok{background:#dcf5e6;color:var(--ok)}.cal-event.ev-bad{background:#fde3ec;color:var(--bad)}.cal-event.ev-blue{background:#e1ebff;color:var(--blue)}
.month-group{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none}
.month-header:hover{background:#f6f7fb}
.month-title{font-size:14.5px;font-weight:700;color:var(--navy)}
.month-chevron{display:flex;color:var(--muted);transition:transform .15s}.month-chevron svg{width:16px;height:16px}.month-chevron.open{transform:rotate(90deg)}
.month-body{padding:10px 18px 8px;border-top:1px solid var(--line)}
.cal-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:#e8eaf3;overflow:hidden}.prog>i{display:block;height:100%;background:var(--blue);transition:width .25s}
@media(max-width:700px){.cal-cell{min-height:58px;padding:4px}.cal-event{font-size:9.5px;padding:1px 4px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" style="display:none"></div>
<script>
/* ===================== helpers ===================== */
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const emptyState=()=>({v:4,auth:true,setup:false,modules:{press:true,archive:true,radio:true},view:'dashboard',tab:{press:'apps',archive:'all',radio:'songs'},artists:[],contacts:[],agencies:[],tours:[],gigs:[],apps:[],songs:[],shows:[],keys:{setlist:'',bandsintown:'',navidrome:''}});
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>new Date(s+'T12:00:00');
const fd=s=>s?D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const dayNum=s=>D(s).getDate();
const mon=s=>D(s).toLocaleDateString('en-GB',{month:'short'}).toUpperCase();
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const plen=t=>{const p=String(t).split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const pad=n=>String(n).padStart(2,'0');
const clock=(start,secs)=>{const [H,M]=start.split(':').map(Number);const t=H*3600+M*60+secs;return pad(Math.floor(t/3600)%24)+':'+pad(Math.floor(t%3600/60))};
const uid=p=>p+Math.random().toString(36).slice(2,8);
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'');
const stars=n=>n?'<span class="star">'+'★'.repeat(n)+'<span style="color:#d5d8e2">'+'★'.repeat(5-n)+'</span></span>':'<span class="muted small">unrated</span>';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3800)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

function importAH(j){
 const n={artists:0,artistsMatched:0,tracks:0,themes:0,agencies:0,contacts:0,links:0,tours:0,skipped:0};
 const amap={};
 ahRows(j.artists,j.artists.cols).forEach(r=>{
  let a=S.artists.find(x=>x.id==='ah'+r.id)||S.artists.find(x=>x.name.toLowerCase()===String(r.name).trim().toLowerCase());
  if(a){n.artistsMatched++;if(!a.bio&&r.bio)a.bio=r.bio;if(!a.photoUrl&&r.photoUrl)a.photoUrl=r.photoUrl;if(!a.origin&&r.location)a.origin=r.location}
  else{a={id:'ah'+r.id,name:String(r.name).trim(),genre:'',origin:r.location||'',mbid:'',notes:'',bio:r.bio||'',photoUrl:r.photoUrl||'',yearFormed:r.yearFormed||'',yearSplit:r.yearSplit||'',isAi:!!r.isAi,complete:!!r.complete};S.artists.push(a);n.artists++}
  amap[r.id]=a.id});
 const tmap={};(j.themes||[]).forEach(([id,name])=>tmap[id]=String(name).toLowerCase());
 const tth={};(j.trackThemes||[]).forEach(([t,th])=>{(tth[t]=tth[t]||[]).push(tmap[th])});
 const have=new Set(S.songs.map(s=>s.id));
 ahRows(j.tracks,j.tracks.cols).forEach(r=>{
  const id='ahs'+r.id;if(have.has(id)||!amap[r.artistId]){n.skipped++;return}
  const th=(tth[r.id]||[]).filter(Boolean);n.themes+=th.length;
  S.songs.push({id,artistId:amap[r.artistId],title:r.title,album:r.album||'',year:r.released?+r.released.slice(0,4):'',released:r.released||'',len:0,genre:'',themes:th,fav:false,nd:'',ndOnly:!!r.navidromeOnly,artUrl:r.artIdx?(j.art[r.artIdx-1]||''):'',trackNo:r.trackNo||'',discNo:r.discNo||''});n.tracks++});
 const gmap={};
 ahRows(j.agencies,j.agencies.cols).forEach(r=>{const had=S.agencies.some(x=>x.company.toLowerCase()===r.company.toLowerCase());gmap[r.id]=ensureAgency(r.company);if(!had)n.agencies++});
 const cmap={};
 ahRows(j.contacts,j.contacts.cols).forEach(r=>{const ag=gmap[r.agencyId];if(!ag)return;const had=S.contacts.some(x=>x.agencyId===ag.id&&x.name.toLowerCase()===r.name.toLowerCase());cmap[r.id]=addContact({agency:ag.company,name:r.name,email:r.email,phone:r.phone},[]);if(!had)n.contacts++});
 ahRows(j.artistAgencies,j.artistAgencies.cols).forEach(r=>{const ag=gmap[r.agencyId],aid=amap[r.artistId];if(!ag||!aid)return;const c=addContact({agency:ag.company},[aid]);n.links++});
 const PM={applied:'Requested',awaiting:'Requested',approved:'Approved',denied:'Declined'};
 ahRows(j.tourDates,j.tourDates.cols).forEach(r=>{const aid=amap[r.artistId];if(!aid||S.tours.some(t=>t.artistId===aid&&t.date===r.date&&t.venue===(r.venue||''))){n.skipped++;return}
  const t={id:'aht'+r.id,artistId:aid,tour:'',date:r.date,venue:r.venue||'',city:r.city||'',status:'On sale',ticketUrl:r.ticketUrl||''};S.tours.push(t);n.tours++;
  if(PM[r.status]){const g=ensureGig(t);S.apps.push({id:'ahp'+r.id,type:'Photo pass',status:PM[r.status],artistId:aid,gigId:g.id,contactId:'',requested:PM[r.status]==='Requested'?TODAY:'',deadline:addDays(t.date,-7),followUp:'',link:'',notes:''})}});
 return n;
}

A.requestPress=d=>{const g=gig(d.id);openForm('Request press access',appFields(),{status:'Draft',gigId:g.id,artistId:g.artistId,type:g.kind==='Festival'?'Accreditation':'Photo pass',deadline:addDays(g.date,-7),contactId:(S.contacts.find(c=>c.artists.includes(g.artistId))||{}).id||''},o=>{S.apps.push({id:uid('p'),...o});S.view='press';S.tab.press='apps'},{saveLabel:'Create request'})};
const tourFields=w=>[...(w?[{k:'artistId',l:'Artist',t:'select',o:artOpts()}]:[]),{k:'tour',l:'Tour name'},{k:'date',l:'Date',t:'date',req:1},{k:'venue',l:'Venue',req:1},{k:'city',l:'City'},{k:'ticketUrl',l:'Ticket link (optional)',w:1},{k:'status',l:'Tickets',t:'select',o:['On sale','Sold out']}];

function tourGig(t){return S.gigs.find(g=>g.artistId===t.artistId&&g.date===t.date)}
function ensureGig(t){let g=tourGig(t);if(!g){g={id:uid('g'),kind:'Gig',title:aname(t.artistId),artistId:t.artistId,date:t.date,endDate:'',venue:t.venue,city:t.city,support:[],lineup:[],setlist:[],rating:0,review:'',published:'',photos:'',cost:0};S.gigs.push(g)}return g}

A.calMove=d=>{let {y,m}=ui.cal;m+=+d.d;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal={y,m};ui.calOpen[dstr(y,m,1).slice(0,7)]=true;render()};

A.calToggle=d=>{const cur=ui.calOpen[d.k]??(d.k===TODAY.slice(0,7));ui.calOpen[d.k]=!cur;render()};

A.tourStatus=(d,t)=>{const x=S.tours.find(v=>v.id===d.id),v=t.value,g=tourGig(x),reqs=g?S.apps.filter(p=>p.gigId===g.id):[];
 if(!v){if(reqs.length&&!confirm('Remove the press request for this date?')){render();return}if(g)S.apps=S.apps.filter(p=>p.gigId!==g.id);commit();return}
 const gg=ensureGig(x);let r=S.apps.find(p=>p.gigId===gg.id);
 if(!r){const c=S.contacts.find(c=>c.artists.includes(x.artistId));r={id:uid('p'),type:'Photo pass',status:v,artistId:x.artistId,gigId:gg.id,contactId:c?c.id:'',requested:'',deadline:addDays(x.date,-7),followUp:'',link:'',notes:''};S.apps.push(r)}
 r.status=v;if(v==='Requested'&&!r.requested)r.requested=TODAY;commit();toast('Press status: '+PRS[v][0])};
A.findTours=async()=>{
 const list=S.artists.slice();if(!list.length){toast('Add some artists first.');return}
 ui.scan={n:0,total:list.length,found:0,run:Date.now()};const me=ui.scan;render();let i=0,stop=false;
 const worker=async()=>{while(!stop&&ui.scan===me){const a=list[i++];if(!a)return;
  try{const r=await fetch('/api/lookup/tour-dates?artist='+encodeURIComponent(a.name),{headers:{'x-bandsintown-id':S.keys.bandsintown||''}});const j=await r.json();
   if(!r.ok){stop=true;ui.scan=null;render();toast(j.error||'Lookup failed');return}
   (j.events||[]).forEach(e=>{if(!S.tours.some(t=>t.artistId===a.id&&t.date===e.date&&(t.venue||'')===(e.venue||''))){S.tours.push({id:uid('t'),artistId:a.id,tour:'',date:e.date,venue:e.venue||'',city:e.city||'',status:'On sale',ticketUrl:e.url||''});me.found++}})}catch(e){}
  me.n++;if(me.n%5===0||me.n===me.total)render()}};
 await Promise.all([worker(),worker(),worker()]);
 if(ui.scan===me){me.done=1;save();render()}};
A.scanClose=()=>{ui.scan=null;render()};
const conFields=()=>[{k:'agency',l:'Agency / label',req:1,list:agencyList()},{k:'name',l:'Contact name (optional)'},{k:'role',l:'Role'},{k:'email',l:'Email',t:'email'},{k:'phone',l:'Phone'},{k:'last',l:'Last contact',t:'date'},{k:'notes',l:'Notes',t:'textarea',w:1},{k:'artists',l:'Represents (hold Ctrl/Cmd for several)',t:'multi',o:artOpts(),w:1}];
A.newContact=()=>A.newAgency();
A.editContact=d=>A.editAgContact(d);
A.delContact=d=>A.delAgContact(d);
A.agq=(d,t)=>{ui.agq=t.value;render()};
A.openAgency=d=>{if(!agencyById(d.id))return;S.agencyId=d.id;S.view='agency';S.tab.press='contacts';ui.open.press=true;ui.q='';commit();window.scrollTo(0,0)};
const agFields=()=>[{k:'company',l:'Company name',req:1,w:1,ph:'Agency name'},{k:'notes',l:'Notes (optional)',t:'textarea',w:1}];
A.newAgency=()=>openForm('Add PR agency',agFields(),{},o=>{const nm=o.company.trim(),ex=S.agencies.find(a=>a.company.toLowerCase()===nm.toLowerCase()),ag=ex||ensureAgency(nm);if(ex)toast('That agency already exists — opened it.');else ag.notes=o.notes;S.agencyId=ag.id;S.view='agency';S.tab.press='contacts';ui.open.press=true},{saveLabel:'Save'});
A.editAgency=d=>{const ag=agencyById(d.id);openForm('Edit PR agency',agFields(),ag,o=>{const nm=o.company.trim();if(S.agencies.some(x=>x.id!==ag.id&&x.company.toLowerCase()===nm.toLowerCase())){toast('Another agency already has that name.');return false}ag.company=nm;ag.notes=o.notes;S.contacts.forEach(c=>{if(c.agencyId===ag.id)c.agency=nm});toast('Saved.')},{extra:`<button class="btn del" data-act="delAgency" data-id="${ag.id}" style="margin-right:auto">Delete agency</button>`})};
A.delAgency=d=>{const ag=agencyById(d.id);if(!confirm(`Delete “${ag.company}” and all its contacts and links?`))return;const ids=S.contacts.filter(c=>c.agencyId===ag.id).map(c=>c.id);S.contacts=S.contacts.filter(c=>c.agencyId!==ag.id);S.apps.forEach(p=>{if(ids.includes(p.contactId))p.contactId=''});S.agencies=S.agencies.filter(a=>a.id!==ag.id);modal=null;S.view='press';S.tab.press='contacts';commit();toast('Agency deleted')};
const agcFields=()=>[{k:'name',l:'Name',req:1,w:1,ph:'Contact name'},{k:'role',l:'Role (optional)'},{k:'phone',l:'Phone (optional)',ph:'+44…'},{k:'email',l:'Email (optional)',t:'email',w:1,ph:'name@agency.com'},{k:'notes',l:'Notes (optional)',t:'textarea',w:1}];
A.newAgContact=d=>{const ag=agencyById(d.id);openForm('Add contact',agcFields(),{},o=>{addContact({...o,agency:ag.company},[]);toast('Saved.')})};
A.editAgContact=d=>{const c=contact(d.id);openForm('Edit contact',agcFields(),c,o=>{Object.assign(c,o);toast('Saved.')})};
A.delAgContact=d=>{const c=contact(d.id);if(!confirm('Remove this contact? Artists linked through them stay linked to the agency.'))return;const ag=agencyById(c.agencyId);if(c.artists.length&&ag){const hold=addContact({agency:ag.company,name:''},c.artists);hold.linkNotes={...(c.linkNotes||{}),...hold.linkNotes}}S.apps.forEach(p=>{if(p.contactId===c.id)p.contactId=''});S.contacts=S.contacts.filter(x=>x.id!==c.id);commit()};
A.linkArtist=d=>{const ag=agencyById(d.id);openForm('Link artist',[{k:'artistName',l:'Artist',req:1,w:1,list:S.artists.map(a=>a.name),ph:'Artist name'},{k:'contactId',l:'Contact at this agency (optional)',t:'select',w:1,o:[['','No specific contact'],...agNamed(ag).map(c=>[c.id,c.name])]},{k:'notes',l:'Notes (optional)',t:'textarea',w:1}],{},o=>{const a=S.artists.find(x=>x.name.toLowerCase()===o.artistName.trim().toLowerCase());if(!a){toast('Pick an existing artist from the list.');return false}const c=o.contactId?contact(o.contactId):addContact({agency:ag.company,name:''},[]);if(!c.artists.includes(a.id))c.artists.push(a.id);c.linkNotes=c.linkNotes||{};if(o.notes)c.linkNotes[a.id]=o.notes;toast('Linked.')})};
A.unlinkAg=d=>{const a=artist(d.a);if(!confirm(`Unlink ${a.name} from this agency?`))return;unlinkArtist(contact(d.id),d.a);commit()};

/* archive */
const gigFields=()=>[{k:'kind',l:'Type',t:'select',o:['Gig','Festival']},{k:'title',l:'Title / headliner',req:1},{k:'artistId',l:'Linked artist (gigs)',t:'select',o:artOpts(1)},{k:'date',l:'Date',t:'date',req:1},{k:'endDate',l:'End date (festivals)',t:'date'},{k:'venue',l:'Venue',req:1},{k:'city',l:'City'},{k:'support',l:'Support acts (comma separated)',w:1},{k:'lineup',l:'Festival line-up (comma separated artist names)',w:1},{k:'setlist',l:'Setlist (one song per line)',t:'textarea',rows:5,w:1},{k:'rating',l:'Rating (0–5)',t:'number',step:'1'},{k:'cost',l:'Ticket cost (£)',t:'number',step:'0.01'},{k:'review',l:'Review notes',t:'textarea',w:1},{k:'published',l:'Link to published review'},{k:'photos',l:'Photos / media link'}];
const gigIn=o=>({...o,support:o.support.split(',').map(x=>x.trim()).filter(Boolean),lineup:o.lineup.split(',').map(x=>x.trim()).filter(Boolean),setlist:o.setlist.split('\n').map(x=>x.trim()).filter(Boolean),rating:Math.max(0,Math.min(5,+o.rating||0)),cost:+o.cost||0});
const gigOut=g=>({...g,support:g.support.join(', '),lineup:g.lineup.join(', '),setlist:g.setlist.join('\n')});
A.newGig=()=>openForm('Add gig / festival',gigFields(),{kind:'Gig',date:TODAY},o=>{S.gigs.push({id:uid('g'),...gigIn(o)})},{wide:1});
A.openGig=d=>{const g=gig(d.id);openForm(g.title,gigFields(),gigOut(g),o=>Object.assign(g,gigIn(o)),{wide:1,extra:`<button class="btn" data-act="fetchSetlist" data-id="${g.id}">Fetch setlist (Setlist.fm)</button>${g.date>=TODAY&&on('press')&&!S.apps.some(p=>p.gigId===g.id)?`<button class="btn" data-act="requestPress" data-id="${g.id}">Request press access</button>`:''}<button class="btn del" data-act="delGig" data-id="${g.id}">Delete</button>`})};
A.fetchSetlist=async d=>{const g=gig(d.id),t=document.querySelector('#mform [name=setlist]');if(!t)return;
 const nm=g.artistId?aname(g.artistId):g.title;toast('Searching Setlist.fm…');
 try{const r=await fetch('/api/lookup/setlist?artist='+encodeURIComponent(nm)+'&date='+encodeURIComponent(g.date),{headers:{'x-setlistfm-key':S.keys.setlist||''}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Lookup failed');
  if(!j.songs.length){toast('No setlist found for that artist and date.');return}t.value=j.songs.join('\n');toast('Setlist filled in from Setlist.fm ('+j.songs.length+' songs)')}
 catch(e){toast(e.message)}};
A.delGig=d=>{if(confirm('Delete this entry?')){S.gigs=S.gigs.filter(g=>g.id!==d.id);S.apps.forEach(p=>{if(p.gigId===d.id)p.gigId=''});modal=null;commit()}};

/* radio */
A.newSong=()=>sfOpen('Add track',{trackNo:'',id:'',title:'',artist:'',album:'',released:'',len:'3:30',genre:'',artUrl:'',nd:'',themes:[]});
A.editSong=d=>{const s=song(d.id);sfOpen('Edit track',{id:s.id,title:s.title,artist:aname(s.artistId),album:s.album||'',released:s.released||'',len:s.len?mmss(s.len):'',genre:s.genre||'',artUrl:s.artUrl||'',trackNo:s.trackNo||'',nd:s.nd||'',themes:(s.themes||[]).slice()})};
A.sfRmTheme=d=>{sfSync();ui.sf.themes=ui.sf.themes.filter(t=>t!==d.t);sfRefresh()};
A.sfPick=()=>document.getElementById('sf-file').click();
A.sfUpload=(d,t)=>{const file=t.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);sfSync();ui.sf.artUrl=c.toDataURL('image/jpeg',.8);sfRefresh()};im.src=rd.result};rd.readAsDataURL(file)};
A.themeFAdd=(d,t)=>{const raw=t.value.trim().toLowerCase();t.value='';const m=thSet().find(x=>x.toLowerCase()===raw);if(m&&!ui.themeF.includes(m)){ui.themeF.push(m);ui.songLimit=15}render()};
A.rmThemeF=d=>{ui.themeF=ui.themeF.filter(t=>t!==d.t);ui.songLimit=15;render()};
A.ndOnly=(d,t)=>{ui.ndOnly=t.checked;ui.songLimit=15;render()};
A.moreSongs=()=>{ui.songLimit+=15;render()};
A.favSong=d=>{const s=song(d.id);s.fav=!s.fav;commit()};
const ndNorm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'');
const ndStatus=()=>ui.nd.msg||(S.nd?`Last synced ${fd(S.nd.at.slice(0,10))}: matched ${S.nd.matched} of ${S.nd.checked} tracks against ${S.nd.library} Navidrome songs.`:'Match your tracks against your Navidrome library to add play links.');
A.ndSync=async()=>{if(ui.nd.busy)return;ui.nd.busy='sync';ui.nd.msg='Connecting to Navidrome…';render();
 try{const st=await (await fetch('/api/navidrome/status')).json();
  if(!st.configured){ui.nd.msg='Navidrome isn’t configured yet — set NAVIDROME_URL, NAVIDROME_USER and NAVIDROME_PASSWORD in your stack.';toast('Navidrome isn’t configured — set the NAVIDROME_* variables in your stack.');return}
  if(!S.keys.navidrome&&st.url)S.keys.navidrome=st.url;
  const lib=[];for(let off=0;;off+=500){const r=await fetch('/api/navidrome/library?offset='+off);const j=await r.json();if(!r.ok)throw new Error(j.error||'Navidrome error');lib.push(...j.songs);ui.nd.msg=`Scanning your library… ${lib.length} songs so far`;render();if(j.songs.length<500)break}
  ui.nd.msg='Matching against your tracks…';render();
  const idx=new Map();lib.forEach(x=>{const k=ndNorm(x[2])+'|'+ndNorm(x[1]);if(!idx.has(k))idx.set(k,x)});
  const base=String(S.keys.navidrome||st.url||'').replace(/\/+$/,'');let matched=0,checked=0;
  S.songs.forEach(s=>{const x=idx.get(ndNorm(aname(s.artistId))+'|'+ndNorm(s.title));if(!s.ndOnly)checked++;
   if(x){s.ndId=x[0];s.ndArt=x[5]||'';s.nd=base&&x[3]?base+'/app/#/album/'+x[3]+'/show':'';if(!s.ndOnly)matched++}else if(s.ndId){s.ndId='';s.nd=''}});
  S.nd={at:new Date().toISOString(),matched,checked,library:lib.length};ui.nd.msg='';save();toast(`Matched ${matched} of ${checked} tracks against ${lib.length} Navidrome songs.`)}
 catch(e){ui.nd.msg='';toast(e.message)}finally{ui.nd.busy=0;render()}};
A.ndArt=async()=>{if(ui.nd.busy)return;ui.nd.busy='art';render();
 try{const st=await (await fetch('/api/navidrome/status')).json();
  if(!st.configured){toast('Navidrome isn’t configured — set the NAVIDROME_* variables in your stack.');return}
  if(!S.songs.some(s=>s.ndArt)){toast('Run Sync Navidrome first so tracks are matched.');return}
  const url=id=>'/api/navidrome/art?id='+encodeURIComponent(id)+'&size=300';const albums={};
  S.songs.forEach(s=>{if(s.ndArt&&!s.artUrl)s.artUrl=url(s.ndArt);const k=s.artistId+'|'+ndNorm(s.album);if(s.album&&s.artUrl)albums[k]=s.artUrl});
  let n=new Set();S.songs.forEach(s=>{if(!s.artUrl&&s.album){const u=albums[s.artistId+'|'+ndNorm(s.album)];if(u){s.artUrl=u}}});
  const got=new Set(S.songs.filter(s=>s.artUrl&&s.artUrl.startsWith('/api/navidrome/art')).map(s=>s.artistId+'|'+ndNorm(s.album)));
  save();toast(`Album art linked for ${got.size} album${got.size===1?'':'s'} from Navidrome.`)}
 catch(e){toast(e.message)}finally{ui.nd.busy=0;render()}};
A.playNd=d=>{const x=S.songs.find(v=>v.id===d.id);if(!x)return;const base=String(S.keys.navidrome||'').replace(/\/+$/,'');if(x.nd){window.open(x.nd,'_blank','noopener');return}if(!base){toast('Set your Navidrome address in Settings first.');return}window.open(base+'/app/#/song?filter='+encodeURIComponent(JSON.stringify({title:x.title})),'_blank','noopener')};
A.delSong=d=>{if(confirm('Delete this song from the database?')){S.songs=S.songs.filter(s=>s.id!==d.id);S.shows.forEach(sh=>sh.items=sh.items.filter(i=>i.songId!==d.id));commit()}};
A.addSong=d=>{const sh=currentShow();if(!sh)return toast('Create a show first');sh.items.push({type:'song',songId:d.id});commit();toast('Added “'+song(d.id).title+'”')};
A.rm=d=>{currentShow().items.splice(+d.i,1);commit()};
A.mv=d=>{const it=currentShow().items,i=+d.i,j=i+ +d.d;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];commit()};
A.addSeg=()=>openForm('Add talk / jingle',[{k:'type',l:'Type',t:'select',o:[['talk','Talk / link / interview'],['jingle','Jingle / ID / ad']]},{k:'label',l:'Label',req:1},{k:'mins',l:'Length (minutes)',t:'number',step:'0.5',def:'2'}],{},o=>{currentShow().items.push({type:o.type,label:o.label,secs:Math.round((+o.mins||0)*60)})});
A.newShow=()=>openForm('New show',[{k:'name',l:'Show name',req:1},{k:'date',l:'Date',t:'date',req:1},{k:'start',l:'Start time',t:'time',def:'19:00'},{k:'mins',l:'Length (minutes)',t:'number',def:'120'}],{date:TODAY},o=>{const s={id:uid('sh'),name:o.name,date:o.date,start:o.start||'19:00',mins:+o.mins||60,items:[]};S.shows.push(s);ui.showId=s.id;S.tab.radio='shows'});
A.editShow=d=>{ui.showId=d.id;S.view='radio';S.tab.radio='shows';commit()};
A.editShowMeta=d=>{const s=S.shows.find(x=>x.id===d.id);openForm('Edit show',[{k:'name',l:'Show name',req:1},{k:'date',l:'Date',t:'date'},{k:'start',l:'Start time',t:'time'},{k:'mins',l:'Length (minutes)',t:'number'}],s,o=>Object.assign(s,{...o,mins:+o.mins||s.mins}))};
A.delShow=d=>{if(confirm('Delete this show and its playlist?')){S.shows=S.shows.filter(s=>s.id!==d.id);ui.showId=null;commit()}};
function rows(sh){let run=0,n=0;return sh.items.map(it=>{const s=it.type==='song'?song(it.songId):null,len=s?s.len:it.secs,st=clock(sh.start,run);run+=len;n++;return {n,st,type:it.type==='song'?'Song':it.type==='talk'?'Talk':'Jingle',artist:s?aname(s.artistId):'',title:s?s.title:it.label,album:s?s.album:'',len}})}
A.expCsv=()=>{const sh=currentShow(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';download(`${sh.date}-${sh.name.replace(/\W+/g,'-')}.csv`,'Order,Start,Type,Artist,Title,Album,Duration\n'+rows(sh).map(r=>[r.n,r.st,r.type,q(r.artist),q(r.title),q(r.album),mmss(r.len)].join(',')).join('\n'),'text/csv')};
A.expM3u=()=>{const sh=currentShow();download(`${sh.date}-${sh.name.replace(/\W+/g,'-')}.m3u`,'#EXTM3U\n'+rows(sh).filter(r=>r.type==='Song').map(r=>`#EXTINF:${r.len},${r.artist} - ${r.title}\n${r.artist} - ${r.title}.mp3`).join('\n')+'\n','audio/x-mpegurl');toast('M3U exported — file paths use “Artist - Title.mp3”; adjust to match your library')};
A.runSheet=()=>{const sh=currentShow(),r=rows(sh);modal={title:'Run sheet',save:null,wide:true,extra:'<button class="btn pri" style="background:var(--acc)" onclick="window.print()">Print / Save as PDF</button>',html:`<div id="runsheet" style="padding:20px"><div style="margin-bottom:12px">${logo('radio',26)}</div><h2>${h(sh.name)}</h2><p>${fd(sh.date)} · ${sh.start}–${clock(sh.start,sh.mins*60)} · Planned ${mmss(showSecs(sh))}</p><table><tr><th>TIME</th><th>TYPE</th><th>ARTIST</th><th>TITLE</th><th>LEN</th></tr>${r.map(x=>`<tr><td>${x.st}</td><td>${x.type}</td><td>${h(x.artist)}</td><td><b>${h(x.title)}</b></td><td>${mmss(x.len)}</td></tr>`).join('')}</table></div>`};render()};

render();
